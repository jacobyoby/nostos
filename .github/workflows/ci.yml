name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: JS static check (legacy)
        run: node --check src/*.js src/lib/*.js 2>&1 || node --check src/*.js
      - name: Python compile
        run: python3 -m py_compile scripts/*.py
      - name: JSON valid
        run: python3 -c "import json; json.load(open('data/nj-libraries.json')); print('json ok')"
      - run: npm test
      - run: node scripts/check-data.mjs
      - run: npm run test:e2e
      - name: Legacy skills tests (flags/geo/validate)
        run: node --test src/*.test.cjs
      - name: Python tests (skills 8)
        run: python3 -m unittest discover -s tests -v
