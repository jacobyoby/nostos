<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostos — NJ Libraries</title>
<meta name="description" content="Every publicly funded library in New Jersey, with Forma Pauperis outreach progress.">
<style>
  :root { --bg:#fbfaf7; --ink:#1d1c1a; --muted:#6b675f; --line:#e4e0d8; --accent:#1f5c8b; --ok:#2e7d4f; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15161a; --ink:#ecebe6; --muted:#a19d95; --line:#2b2d33; --accent:#7fb3e0; --ok:#7cc79a; --warn:#e0a94a; } }
  :root[data-theme="dark"] { --bg:#15161a; --ink:#ecebe6; --muted:#a19d95; --line:#2b2d33; --accent:#7fb3e0; --ok:#7cc79a; --warn:#e0a94a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .progress { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tile b { display:block; font-size:1.5rem; line-height:1.1; }
  .tile span { color:var(--muted); font-size:.85rem; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0 20px; }
  .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .3s; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); min-width:160px; }
  input[type=search] { flex:1 1 240px; }
  table { width:100%; border-collapse:collapse; font-size:.93rem; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0; background:var(--bg); }
  td a { color:var(--accent); }
  .st { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.78rem; border:1px solid var(--line); }
  .st-todo { color:var(--muted); }
  .st-contacted { color:var(--warn); border-color:var(--warn); }
  .st-posted, .st-partner { color:var(--ok); border-color:var(--ok); }
  .legal { color:var(--ok); font-weight:600; }
  .empty { color:var(--muted); padding:32px 0; text-align:center; }
  @media (max-width:640px) { th:nth-child(4), td:nth-child(4) { display:none; } }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .skip-link { position:absolute; left:12px; top:8px; background:var(--ink); color:var(--bg); padding:6px 10px; border-radius:6px; transform:translateY(-150%); transition:transform .15s; z-index:10; }
  .skip-link:focus { transform:translateY(0); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main">
  <h1>Nostos</h1>
  <p class="sub">Every publicly funded library in New Jersey. Outreach progress for Forma Pauperis.</p>

  <div class="progress" id="progress"></div>
  <div class="bar"><i id="bar"></i></div>

  <div class="controls" role="search" aria-label="Filter libraries">
    <label class="sr-only" for="q">Search</label>
    <input type="search" id="q" placeholder="Search name, city, system…" aria-label="Search name, city, or system" data-testid="search">
    <label class="sr-only" for="county">County</label>
    <select id="county" aria-label="Filter by county" data-testid="county"><option value="">All counties</option></select>
    <label class="sr-only" for="status">Outreach status</label>
    <select id="status" aria-label="Filter by outreach status" data-testid="status">
      <option value="">All statuses</option>
      <option value="todo">To do</option>
      <option value="contacted">Contacted</option>
      <option value="posted">Posted</option>
      <option value="partner">Partner</option>
    </select>
    <label class="sr-only" for="legal">Legal help</label>
    <select id="legal" aria-label="Filter by legal-help program" data-testid="legal">
      <option value="">Legal help: any</option>
      <option value="yes">Has legal-help program</option>
      <option value="unknown">Unknown</option>
    </select>
  </div>
  <p id="result-count" class="sr-only" aria-live="polite" aria-atomic="true"></p>

  <table data-testid="table">
    <caption class="sr-only">New Jersey public libraries — filterable by county, outreach status, and legal-help program. 449 outlets.</caption>
    <thead><tr><th scope="col">Library</th><th scope="col">System</th><th scope="col">County</th><th scope="col">Address</th><th scope="col">Legal help</th><th scope="col">Outreach</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" role="status" hidden>No libraries match.</p>
</main>

<script src="flags.js"></script>
<script>
(async function () {
  const res = await fetch("../data/nj-libraries.json", { cache: "no-store" });
  if (!res.ok) throw new Error("nj-libraries.json fetch failed: " + res.status);
  const all = await res.json();

  const title = s => (s || "").toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase()).replace(/\bOf\b/g, "of");
  const counties = [...new Set(all.map(r => r.county).filter(Boolean))].sort();
  const countySel = document.getElementById("county");
  for (const c of counties) { const o = document.createElement("option"); o.value = c; o.textContent = title(c); countySel.appendChild(o); }

  const q = document.getElementById("q"), statusSel = document.getElementById("status"), legalSel = document.getElementById("legal");
  const rows = document.getElementById("rows"), empty = document.getElementById("empty");

  function statusOf(r) { return (r.outreach && r.outreach.status) || "todo"; }
  function legalOf(r) { return r.has_legal_help_program === true ? "yes" : r.has_legal_help_program === false ? "no" : "unknown"; }

  function renderProgress() {
    const total = all.length;
    const by = { contacted: 0, posted: 0, partner: 0 };
    for (const r of all) { const s = statusOf(r); if (s in by) by[s]++; }
    const done = by.contacted + by.posted + by.partner;
    const legal = all.filter(r => r.has_legal_help_program === true).length;
    const systems = new Set(all.map(r => r.system_name)).size;
    document.getElementById("progress").innerHTML = [
      ["Outlets", total], ["Systems", systems], ["Counties", counties.length],
      ["Reached", done], ["Posted / partner", by.posted + by.partner], ["Legal-help programs", legal]
    ].map(([k, v]) => `<div class="tile"><b>${v}</b><span>${k}</span></div>`).join("");
    document.getElementById("bar").style.width = total ? (100 * done / total).toFixed(1) + "%" : "0%";
  }

  function render() {
    const term = q.value.trim().toLowerCase(), county = countySel.value, st = statusSel.value, lg = legalSel.value;
    const list = all.filter(r =>
      (!county || r.county === county) &&
      (!st || statusOf(r) === st) &&
      (!lg || legalOf(r) === lg) &&
      (!term || [r.outlet_name, r.system_name, r.city, r.zip].filter(Boolean).join(" ").toLowerCase().includes(term))
    );
    rows.innerHTML = list.map(r => {
      const s = statusOf(r);
      const name = r.website ? `<a href="${r.website}" rel="noopener">${title(r.outlet_name)}</a>` : title(r.outlet_name);
      const legal = r.has_legal_help_program === true
        ? `<span class="legal">${r.legal_help_evidence ? `<a href="${r.legal_help_evidence}" rel="noopener">yes</a>` : "yes"}</span>`
        : r.has_legal_help_program === false ? "no" : "<span style='color:var(--muted)'>?</span>";
      return `<tr data-fscs="${r.fscskey}-${r.fscs_seq}">
        <td>${name}<br><small style="color:var(--muted)">${r.outlet_type || ""}${r.phone ? " · " + r.phone : ""}</small></td>
        <td>${title(r.system_name)}</td><td>${title(r.county)}</td>
        <td>${[title(r.address), title(r.city), r.zip].filter(Boolean).join(", ")}</td>
        <td>${legal}</td>
        <td><span class="st st-${s}">${s}</span>${r.outreach && r.outreach.notes ? `<br><small>${r.outreach.notes}</small>` : ""}</td>
      </tr>`;
    }).join("");
    empty.hidden = list.length > 0;
    const countEl = document.getElementById("result-count");
    if (countEl) countEl.textContent = `${list.length} of ${all.length} libraries shown`;
  }

  for (const el of [q, countySel, statusSel, legalSel]) el.addEventListener("input", render);
  renderProgress(); render();
})();
</script>
</body>
</html>
